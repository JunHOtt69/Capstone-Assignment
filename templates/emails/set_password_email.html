<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body style="font-family: 'Nunito Sans', sans-serif; 
                background: white;">
    <div class="contentWrapper" style="background: white; 
                padding: 20px 40px 40px; 
                border: 0.1vw solid black;
                width: 350px; 
                height: 350px;">
        <div class="imageWrappeer" style="width: 100%; text-align: center; margin-bottom: 20px;">
            <img src="https://www.apu.edu.my/themes/custom/apu/images/navbar/navbar-logo--scrolled.png" alt="University Logo" width: 200 style=" display: inline-block; vertical-align: middle;">
        </div>
        
        <h2 style="text-align: center;
        width: 100%;">Welcome to Smart Campus</h2>
        <p style="margin-bottom: 10px;
                width: 100%;
                height: max-content;
                display: flex;
                justify-content: center;
                align-items: center;
                color: black;
                font-size: 16px;
                text-align: center;">Hi {{ first_name }},</p>

        <p style="margin-bottom: 10px;
                width: 100%;
                height: max-content;
                display: flex;
                justify-content: center;
                align-items: center;
                color: black;
                font-size: 16px;
                text-align: center;">Your account has been created.</p>

        <p style="margin: 0;
                width: 100%;
                height: max-content;
                display: flex;
                justify-content: center;
                align-items: center;
                color: black;
                font-size: 16px;
                margin-bottom: 10px;">
            Click below to set your password:
        </p>

        <p style="margin: 0;
                width: 100%;
                height: max-content;
                display: flex;
                justify-content: center;
                align-items: center;
                color: black;
                font-size: 16px;">
            <a href="{{ reset_link }}" 
               style="background:greenyellow; color:black; padding:10px 15px; text-decoration:none; margin-bottom: 30px; border: 0.1vw solid black; font-weight: 800;">
               Set Password
            </a>
        </p>

        <p style="margin: 0;
                width: 100%;
                height: max-content;
                display: flex;
                justify-content: center;
                align-items: center;
                color: black;
                font-size: 16px;">If you didn't request this, ignore this email.</p>
    </div>
</body>
</html>
