<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
        <style>
            body{
                font-family: 'Nunito Sans', sans-serif; 
                background: white;
            }

            p{
                margin: 0;
                width: max-content;
                height: max-content;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .contentWrapper{
                background: white; 
                padding: 20px 40px 40px; 
                border: 0.1vw solid black;
                width: max-content; 
                display: flex; 
                justify-content: flex-start; 
                align-items: center; 
                flex-direction: column;
                gap: 10px;
            }
        </style>
</head>
<body>
    <div class="contentWrapper">
        <h2>Welcome to Smart Campus</h2>
        <p>Hi {{ first_name }},</p>

        <p>Your account has been created.</p>

        <p>
            Click below to set your password:
        </p>

        <p>
            <a href="{{ reset_link }}" 
               style="background:#000; color:#fff; padding:10px 15px; text-decoration:none; margin-top: -5px; margin-bottom: 10px;">
               Set Password
            </a>
        </p>

        <p>If you didn’t request this, ignore this email.</p>
    </div>
</body>
</html>
