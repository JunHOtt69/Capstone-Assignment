<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5" style="max-width: 800px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Book Facility</h2>
        <a href="{% url 'facility_list' %}" class="btn btn-outline-secondary">Back to Facilities</a>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-4">

            {% if error %}
            <div class="alert alert-danger">
                {{error}}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Facility</label>
                    <input type="text" class="form-control" value="{{ facility.facility_name }}" readonly>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Booking Date</label>
                        <input type="date" class="form-control" name="date" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Purpose</label>
                        <input type="text" class="form-control" name="purpose" placeholder="e.g. Group discussion">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Start Time</label>
                        <input type="time" class="form-control" name="start_time" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">End Time</label>
                        <input type="time" class="form-control" name="end_time" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'facility_list' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Booking</button>
                </div>
            </form>

        </div>
    </div>
</div>
