{% extends "base.html" %}
{% load static %}

{% block title %} Attendance Signup {% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/attendance.css' %}">
{% endblock %}

{% block content %}
<div class="otp-card">
  <h2>Enter OTP</h2>

  <div id="msg" class="msg" style="display:none;"></div>

  <div class="otp-grid" id="otpGrid">
    <input class="otp-box-input" inputmode="numeric" maxlength="1" />
    <input class="otp-box-input" inputmode="numeric" maxlength="1" />
    <input class="otp-box-input" inputmode="numeric" maxlength="1" />
    <input class="otp-box-input" inputmode="numeric" maxlength="1" />
  </div>

  <p class="muted">OTP will be verified automatically when you complete 4 digits.</p>
</div>
{% endblock %}

{% block background_scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  const inputs = Array.from(document.querySelectorAll(".otp-box-input"));
  const msg = document.getElementById("msg");

  function showMsg(text, type) {
    msg.style.display = "block";
    msg.textContent = text;
    msg.className = "msg " + (type === "ok" ? "msg-success" : "msg-error");
  }

  function getOTP() {
    return inputs.map(i => i.value).join("");
  }

  function isComplete() {
    return inputs.every(i => i.value.length === 1);
  }

  async function verifyOTP() {
    const otp = getOTP();

    const res = await fetch("{% url 'attendance_signup' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "X-CSRFToken": "{{ csrf_token }}",
      },
      body: new URLSearchParams({ otp })
    });

    const text = await res.text();

    if (text.includes("Attendance recorded successfully")) {
      showMsg("Attendance successful!", "ok");
    } else if (text.includes("OTP not available")) {
      showMsg("OTP not available yet. Please ask lecturer to generate OTP.", "err");
    } else if (text.includes("OTP expired")) {
      showMsg("OTP expired. Please ask lecturer to generate a new OTP.", "err");
    } else if (text.includes("Invalid OTP")) {
      showMsg("Invalid code. Please try again.", "err");
    } else {
      showMsg("Verification failed. Please try again.", "err");
    }
  }

  inputs.forEach((input, idx) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "");

      if (input.value && idx < inputs.length - 1) {
        inputs[idx + 1].focus();
      }

      if (isComplete()) {
        verifyOTP();
      }
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && idx > 0) {
        inputs[idx - 1].focus();
      }
    });

    input.addEventListener("paste", (e) => {
      e.preventDefault();
      const data = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4);
      data.split("").forEach((ch, i) => {
        if (inputs[i]) inputs[i].value = ch;
      });
      inputs[Math.min(data.length, 4) - 1]?.focus();
      if (data.length === 4) verifyOTP();
    });
  });

  inputs[0].focus();
});
</script>
{% endblock %}
