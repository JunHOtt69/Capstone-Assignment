{% extends "base.html" %} 

{% load static %}  

{% block title %} Navigation {% endblock %}

{% block extra_head %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/navigation.css' %}">
    <link rel="stylesheet" href="{% static 'css/campus_map.css' %}">
{% endblock %}

{% block content %}
    <div class="navigation-container">
        <!-- Header Section -->
        <div class="navigation-header">
            <h1>Campus Navigation</h1>
            <p class="navigation-subtitle">Find your way across campus with ease</p>
        </div>

        <!-- Control Toolbar -->
        <div class="control-toolbar">
            <div class="controls-grid">
                <div class="control-group">
                    <label for="startSelect">Start Location</label>
                    <select id="startSelect" class="control-select"></select>
                </div>
                <div class="control-group">
                    <label for="endSelect">End Location</label>
                    <select id="endSelect" class="control-select"></select>
                </div>
                <div class="control-group" style="display: flex; align-items: flex-end;">
                    <button id="findPath" class="btn-primary">Find Path</button>
                </div>
            </div>
        </div>

        <!-- Map Container -->
        <div class="map-card">
            <div id="mapWrapper" class="map-wrapper">
                <img src="{% static 'myapp/images/campus-map.svg' %}" />
                <svg 
                    id="campusMap" 
                    viewBox="0 0 800 600" 
                    class="campus-svg">
                </svg>
            </div>
        </div>

        <!-- Admin Edit Button -->
        {% if user.is_authenticated and user.role == 'admin' %}
        <div class="admin-actions">
            <button onclick="window.location.href='/editmap'" class="btn-secondary">
                ✏️ Edit Map
            </button>
        </div>
        {% endif %}
    </div>

    <script>window.MAP_DATA_URL = "{% url 'map_data' %}";</script>
    <script src="{% static 'js/campus_map.js' %}"></script>

{% endblock %}
