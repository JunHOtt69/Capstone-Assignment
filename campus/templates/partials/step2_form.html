{% extends 'auth.html' %}

{% block form_content %}
    <form id="step-form" data-next-step="3" method="post">
        {% csrf_token %}
        <h3>Enter Verification Code</h3>

        <div class="otp-container">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
        </div>
        
        {{ form.as_p }}
        

        <div class="formOptions">
            <a class="return-login" href="{% url 'login' %}">Back to Login →</a>
        </div>

        <div class="formFooter">
            <p id="errorMessage">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Maxime, officia.</p>
            <button type="submit" id="sendCodeButton">Verify</button>
        </div>
    </form>
{% endblock %}
